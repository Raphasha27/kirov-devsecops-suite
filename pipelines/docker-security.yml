name: Docker Security Pipeline

on:
  push:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.*'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
      - '.dockerignore'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.*'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
      - '.dockerignore'
  schedule:
    - cron: '0 2 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles with hadolint
        run: |
          find . -name 'Dockerfile*' -type f | while read -r df; do
            echo "::group::Linting $df"
            hadolint --no-color "$df" || true
            echo "::endgroup::"
          done

      - name: Lint docker-compose files
        run: |
          if command -v docker-compose &> /dev/null; then
            for f in docker-compose*.yml docker-compose*.yaml; do
              if [ -f "$f" ]; then
                echo "::group::Linting $f"
                docker-compose -f "$f" config --quiet && echo "Valid: $f" || echo "Invalid: $f"
                echo "::endgroup::"
              fi
            done
          fi

  multi-stage-analysis:
    name: Multi-stage Build Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyze Dockerfile stages
        id: analyze
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile found"
            exit 0
          fi
          echo "::group::Stage Analysis"
          STAGES=$(grep -c '^FROM' Dockerfile || echo 0)
          echo "Total stages: $STAGES"
          grep '^FROM' Dockerfile | while read -r line; do
            echo "  - $line"
          done

          # Check for multi-stage best practices
          if grep -q 'COPY --from=' Dockerfile; then
            echo "Multi-stage build detected: using COPY --from="
          else
            echo "Warning: No COPY --from= found. Consider using multi-stage builds."
          fi

          # Check for scratch images
          if grep -q 'FROM.*scratch' Dockerfile; then
            echo "Scratch image detected - good for minimal final images"
          fi

          # Check for distroless
          if grep -q 'FROM.*distroless' Dockerfile; then
            echo "Distroless image detected - good attack surface reduction"
          fi
          echo "::endgroup::"

          echo "stages=$STAGES" >> $GITHUB_OUTPUT

      - name: Check build context size
        run: |
          echo "::group::Build Context"
          CONTEXT_SIZE=$(du -sh . 2>/dev/null | cut -f1)
          echo "Context size: $CONTEXT_SIZE"
          if [ -f .dockerignore ]; then
            echo ".dockerignore found - checking exclusions"
            cat .dockerignore
          else
            echo "Warning: No .dockerignore found. Consider adding one."
          fi
          echo "::endgroup::"

  base-image-scan:
    name: Base Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [dockerfile-lint, multi-stage-analysis]
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Extract base images from Dockerfile
        id: base_images
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile found"
            exit 0
          fi
          IMAGES=$(grep '^FROM' Dockerfile | awk '{print $2}' | tr '\n' ' ')
          echo "Base images: $IMAGES"
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

          # List just the final stage image
          FINAL=$(grep '^FROM' Dockerfile | tail -1 | awk '{print $2}')
          echo "final=$FINAL" >> $GITHUB_OUTPUT

      - name: Scan base images
        continue-on-error: true
        run: |
          mkdir -p trivy-reports
          for IMAGE in ${{ steps.base_images.outputs.images }}; do
            echo "::group::Scanning $IMAGE"
            trivy image --severity HIGH,CRITICAL --no-progress \
              --format sarif \
              --output "trivy-reports/$(echo $IMAGE | tr '/' '_' | tr ':' '_').sarif" \
              "$IMAGE"
            echo "::endgroup::"
          done

      - name: Upload base image scan results
        uses: actions/upload-artifact@v4
        with:
          name: base-image-scans
          path: trivy-reports/
          retention-days: 30

      - name: Check for outdated base images
        run: |
          echo "::group::Base Image Age Check"
          for IMAGE in ${{ steps.base_images.outputs.images }}; do
            echo "Checking $IMAGE..."
            # Get image creation date
            docker pull -q "$IMAGE" 2>/dev/null
            CREATED=$(docker inspect "$IMAGE" --format='{{.Created}}' 2>/dev/null || echo "unknown")
            echo "  Created: $CREATED"
          done
          echo "::endgroup::"

  layer-analysis:
    name: Layer Analysis (Dive)
    runs-on: ubuntu-latest
    needs: base-image-scan
    steps:
      - uses: actions/checkout@v4

      - name: Install Dive
        run: |
          curl -sL https://github.com/wagoodman/dive/releases/latest/download/dive_linux_amd64.tar.gz -o dive.tar.gz
          tar -xzf dive.tar.gz -C /usr/local/bin/

      - name: Build image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          else
            echo "No Dockerfile found"
            exit 0
          fi

      - name: Run Dive analysis
        continue-on-error: true
        run: |
          CI=true dive ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --ci-config .dive-ci.yml 2>&1 | tee dive-report.txt || true

      - name: Analyze layer efficiency
        run: |
          echo "::group::Layer Efficiency Report"
          docker history --no-trunc ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | \
            awk 'NR>1 {printf "%-20s %-40s %-10s %s\n", $1, $2, $3, $4}'
          echo "::endgroup::"

      - name: Upload Dive report
        uses: actions/upload-artifact@v4
        with:
          name: dive-analysis
          path: dive-report.txt

  sbom-generation:
    name: SBOM Generation (CycloneDX)
    runs-on: ubuntu-latest
    needs: [base-image-scan, layer-analysis]
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM with Syft
        run: |
          if docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} >/dev/null 2>&1; then
            syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              -o cyclonedx-json=sbom-cyclonedx.json \
              -o spdx-json=sbom-spdx.json
          elif [ -f Dockerfile ]; then
            syft dir:. -o cyclonedx-json=sbom-cyclonedx.json -o spdx-json=sbom-spdx.json
          else
            echo "No image or Dockerfile to generate SBOM from"
            exit 0
          fi

      - name: Install Grype for SBOM vulnerability scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan SBOM for vulnerabilities
        continue-on-error: true
        run: |
          if [ -f sbom-cyclonedx.json ]; then
            grype sbom:./sbom-cyclonedx.json \
              --fail-on high \
              --output sarif \
              --file grype-sbom-results.sarif
          fi

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
            grype-sbom-results.sarif
          retention-days: 90

      - name: Upload SBOM as attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: sbom-cyclonedx.json

  docker-compliance:
    name: Docker Compliance Check
    needs: [sbom-generation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Docker security compliance
        run: |
          echo "::notice::Docker Security Compliance"
          echo "================================"
          echo "Dockerfile Lint: ${{ needs.dockerfile-lint.result }}"
          echo "Base Image Scan: ${{ needs.base-image-scan.result }}"
          echo "Layer Analysis: ${{ needs.layer-analysis.result }}"
          echo "SBOM Generation: ${{ needs.sbom-generation.result }}"
          echo "================================"

          # Generate compliance score
          PASS=0
          TOTAL=4
          [ "${{ needs.dockerfile-lint.result }}" = "success" ] && PASS=$((PASS+1))
          [ "${{ needs.base-image-scan.result }}" = "success" ] && PASS=$((PASS+1))
          [ "${{ needs.layer-analysis.result }}" = "success" ] && PASS=$((PASS+1))
          [ "${{ needs.sbom-generation.result }}" = "success" ] && PASS=$((PASS+1))

          SCORE=$((PASS * 100 / TOTAL))
          echo "Compliance Score: $SCORE% ($PASS/$TOTAL)"
          echo "score=$SCORE" >> $GITHUB_OUTPUT
