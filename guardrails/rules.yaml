# =============================================================================
# SECTION 4: Privilege Escalation Prevention
# =============================================================================
# Rules to prevent privilege escalation in containers.

privilege_escalation:
  policy: BLOCK
  description: Prevent privilege escalation in containers
  rules:
    - id: PRIV-001
      severity: CRITICAL
      category: container-security
      check: privileged
      description: "Containers must not run in privileged mode"
      action: BLOCK
      message: "privileged: true detected. Containers must never run in privileged mode."
      remediation: "Remove 'privileged: true' from container security context"
      k8s_field: "spec.containers[*].securityContext.privileged"
      docker_field: "privileged"

    - id: PRIV-002
      severity: HIGH
      category: container-security
      check: allowPrivilegeEscalation
      description: "Containers must not allow privilege escalation"
      action: BLOCK
      message: "allowPrivilegeEscalation: true detected. This can allow privilege escalation via setuid binaries."
      remediation: "Set 'allowPrivilegeEscalation: false' in container security context"
      k8s_field: "spec.containers[*].securityContext.allowPrivilegeEscalation"
      docker_field: "N/A (defaults to true)"

    - id: PRIV-003
      severity: HIGH
      category: container-security
      check: runAsUser
      description: "Containers must not run as root (UID 0)"
      action: BLOCK
      message: "Container running as root. Use a non-root user (UID > 10000)."
      remediation: "Set 'runAsUser: 10001' or higher in security context"
      k8s_field: "spec.containers[*].securityContext.runAsUser"
      docker_field: "USER directive in Dockerfile"

    - id: PRIV-004
      severity: HIGH
      category: container-security
      check: capabilities
      description: "Container capabilities must be restricted"
      action: WARN
      message: "Full Linux capabilities detected. Drop all and add only required capabilities."
      remediation: "Set 'capabilities.drop: [ALL]' and add only needed capabilities"
      k8s_field: "spec.containers[*].securityContext.capabilities"
      required_drops:
        - ALL
      allowed_additions:
        - NET_BIND_SERVICE
        - NET_RAW
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - FSETID
        - KILL
        - SETGID
        - SETUID
        - SETPCAP
        - SYS_CHROOT

    - id: PRIV-005
      severity: MEDIUM
      category: container-security
      check: seccomp
      description: "Seccomp profile should be configured"
      action: WARN
      message: "No seccomp profile set. Use RuntimeDefault for production."
      remediation: "Set 'seccompProfile.type: RuntimeDefault' in security context"
      k8s_field: "spec.containers[*].securityContext.seccompProfile"

    - id: PRIV-006
      severity: MEDIUM
      category: container-security
      check: seLinuxOptions
      description: "SELinux options should be configured for enhanced security"
      action: WARN
      message: "No SELinux context configured."
      remediation: "Configure seLinuxOptions for workload isolation"

# =============================================================================
# SECTION 5: Read-Only Root Filesystem
# =============================================================================
# Rules requiring read-only root filesystem for containers.

readonly_rootfs:
  policy: BLOCK
  description: Containers must use read-only root filesystem
  rules:
    - id: ROFS-001
      severity: HIGH
      category: container-security
      check: readOnlyRootFilesystem
      description: "Container root filesystem must be read-only"
      action: BLOCK
      message: "readOnlyRootFilesystem not set to true. Containers should have immutable rootfs."
      remediation: "Set 'readOnlyRootFilesystem: true' in security context"
      k8s_field: "spec.containers[*].securityContext.readOnlyRootFilesystem"
      docker_run_flag: "--read-only"
      exceptions:
        - "Temporary write directories MUST use emptyDir volumes"
        - "Log directories MUST be mounted as tmpfs or emptyDir"
        - "Application data directories MUST use persistent volumes"

    - id: ROFS-002
      severity: MEDIUM
      category: container-security
      check: writablePaths
      description: "Writable paths should be explicitly declared"
      action: WARN
      message: "Container has writable rootfs or emptyDir mounts. Verify these are needed."
      remediation: "Remove unnecessary emptyDir mounts or make rootfs read-only"
      allowed_writable_paths:
        - /tmp
        - /var/run
        - /var/log
        - /var/cache
        - /var/spool
        - /data
        - /app/data

    - id: ROFS-003
      severity: LOW
      category: container-security
      check: tmpfsMounts
      description: "Temporary filesystems should use tmpfs"
      action: WARN
      message: "Consider using tmpfs mounts for ephemeral data instead of emptyDir"
      remediation: "Replace emptyDir with 'medium: Memory' where possible"

# =============================================================================
# SECTION 6: Network Security Rules
# =============================================================================

network_security:
  policy: WARN
  description: Network security policies for container workloads
  rules:
    - id: NET-001
      severity: HIGH
      category: network
      description: "Containers should not use host network mode"
      action: BLOCK
      k8s_field: "spec.containers[*].hostNetwork"
      message: "hostNetwork: true detected. Use pod networking instead."

    - id: NET-002
      severity: HIGH
      category: network
      description: "Containers should not use host ports"
      action: WARN
      k8s_field: "spec.containers[*].ports[*].hostPort"
      message: "hostPort detected. Use NodePort or LoadBalancer instead."

    - id: NET-003
      severity: MEDIUM
      category: network
      description: "Network policies should be defined"
      action: WARN
      check: networkPolicy
      message: "No NetworkPolicy found for namespace. Define least-privilege network policies."

    - id: NET-004
      severity: MEDIUM
      category: network
      description: "Ingress should use TLS"
      action: WARN
      check: ingressTLS
      message: "Ingress without TLS configured. All ingress should use TLS 1.2+."

# =============================================================================
# SECTION 7: Secrets Management
# =============================================================================

secrets_management:
  policy: BLOCK
  description: Rules for secrets handling in code and configuration
  rules:
    - id: SEC-001
      severity: CRITICAL
      category: secrets
      description: "Hardcoded secrets in code are forbidden"
      action: BLOCK
      message: "Potential hardcoded secret detected. Use secret management solution."
      patterns:
        - "(?i)(password|passwd|secret|token|api[_-]?key|apikey).{0,5}[:=].{0,5}['\"][^'\"]{8,}['\"]"
        - "(?i)(aws_access_key_id|aws_secret_access_key).{0,5}[:=].{0,5}['\"][^'\"]+['\"]"
        - "(?i)-----BEGIN (RSA|EC|DSA|OPENSSH|PGP) PRIVATE KEY-----"
        - "(?i)ghp_[a-zA-Z0-9]{36}"
        - "(?i)gho_[a-zA-Z0-9]{36}"
        - "(?i)ghu_[a-zA-Z0-9]{36}"
        - "(?i)ghs_[a-zA-Z0-9]{36}"
        - "(?i)ghr_[a-zA-Z0-9]{36}"
        - "(?i)xox[baprs]-[0-9a-zA-Z]{10,}"
        - "(?i)sk_live_[0-9a-zA-Z]+"
        - "(?i)pk_live_[0-9a-zA-Z]+"
        - "(?i)AKIA[0-9A-Z]{16}"
        - "(?i)-----BEGIN CERTIFICATE-----"
      remediation: "Use vault, AWS Secrets Manager, or Kubernetes Secrets with external secrets operator"

    - id: SEC-002
      severity: HIGH
      category: secrets
      description: "Environment variables should reference secrets, not embed them"
      action: WARN
      patterns:
        - "env:.*value.*password"
        - "env:.*value.*secret"
        - "env:.*value.*token"

# =============================================================================
# SECTION 8: Resource Limits
# =============================================================================

resource_limits:
  policy: WARN
  description: Resource limit requirements for containers
  rules:
    - id: RES-001
      severity: HIGH
      category: resource-management
      description: "Container CPU and memory limits are required"
      action: WARN
      k8s_fields:
        - "spec.containers[*].resources.limits.cpu"
        - "spec.containers[*].resources.limits.memory"
      message: "Resource limits not defined. Set CPU and memory limits for all containers."
      remediation: "Add resources.limits.cpu and resources.limits.memory to container spec"

    - id: RES-002
      severity: MEDIUM
      category: resource-management
      description: "Container resource requests are recommended"
      action: WARN
      k8s_fields:
        - "spec.containers[*].resources.requests.cpu"
        - "spec.containers[*].resources.requests.memory"
      message: "Resource requests not defined. Set CPU and memory requests for scheduling."

    - id: RES-003
      severity: LOW
      category: resource-management
      description: "CPU limits should not exceed 4 cores per container"
      action: WARN
      max_cpu: "4"
      message: "CPU limit exceeds recommended maximum of 4 cores."
