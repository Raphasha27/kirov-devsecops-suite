# Kirov DevSecOps Guardrails - Policy-as-Code Rules
# ====================================================
# These rules are enforced at pipeline runtime. Violations in BLOCK
# policies cause pipeline failure. WARN policies produce alerts.

meta:
  name: kirov-devsecops-guardrails
  version: 1.0.0
  description: Policy-as-code rules for the Kirov DevSecOps Suite
  contact: security@kirov.dev
  last_updated: 2026-06-03

# =============================================================================
# SECTION 1: Dependency Blocklist
# =============================================================================
# Block high-risk dependencies from being introduced into the codebase.

dependency_blocklist:
  policy: BLOCK
  description: Block list for high/critical risk dependencies
  rules:
    - id: DEP-001
      severity: CRITICAL
      category: known-exploited
      ecosystems:
        - pypi
        - npm
        - go
      packages:
        - name: event-stream
          reason: "CVE-2018-16487 - flatmap-stream dependency backdoor (npm)"
        - name: flatmap-stream
          reason: "CVE-2018-16487 - malicious code injection"
        - name: ua-parser-js
          version: <0.7.28
          reason: "CVE-2021-32650 - ReDoS vulnerability"
        - name: lodash
          version: <4.17.21
          reason: "CVE-2021-23337 - prototype pollution"
        - name: axios
          version: <0.21.2
          reason: "CVE-2021-3749 - SSRF vulnerability"
        - name: minimist
          version: <1.2.6
          reason: "CVE-2021-44906 - prototype pollution"
        - name: node-fetch
          version: <2.6.7
          reason: "CVE-2022-0235 - URL request poisoning"
        - name: ansi-regex
          version: <5.0.1
          reason: "CVE-2021-3807 - ReDoS vulnerability"
        - name: urijs
          version: <1.19.11
          reason: "CVE-2022-1242 - XSS via hostname"
        - name: log4j-core
          versions:
            - ">=2.0,<2.17.0"
          reason: "CVE-2021-44228 - Log4Shell RCE vulnerability"
        - name: jackson-databind
          versions:
            - ">=2.0,<2.13.4.2"
          reason: "CVE-2022-42003 - Deserialization RCE"
        - name: spring-core
          versions:
            - ">=5.0,<5.3.20"
          reason: "CVE-2022-22965 - SpringShell RCE"
        - name: django
          versions:
            - ">=3.2,<3.2.19"
            - ">=4.0,<4.0.9"
          reason: "CVE-2023-31047 - SQL injection via Truncator"
        - name: flask
          version: <2.3.2
          reason: Multiple high-severity CVEs
        - name: requests
          version: <2.31.0
          reason: "CVE-2023-32681 - information disclosure via redirect"
        - name: urllib3
          version: <2.0.6
          reason: "CVE-2023-43804 - cookie header injection"
        - name: certifi
          version: <2023.7.22
          reason: "CVE-2023-37920 - e-trust certificate revocation"
        - name: jinja2
          version: <3.1.3
          reason: "CVE-2024-22195 - XSS via xmlattr filter"
        - name: cryptography
          version: <41.0.6
          reason: "CVE-2023-49083 - NULL pointer dereference"
        - name: golang.org/x/net
          version: <0.17.0
          reason: "CVE-2023-39325 - HTTP/2 rapid reset attack"

# =============================================================================
# SECTION 2: Allowed Base Images
# =============================================================================
# Only explicitly allowed base images may be used in Dockerfiles.

allowed_base_images:
  policy: BLOCK
  description: Only approved base images may be used in Dockerfiles
  rules:
    - id: IMG-001
      severity: CRITICAL
      category: base-image
      registries:
        - docker.io
        - ghcr.io
        - gcr.io
        - amazonaws.com
        - mcr.microsoft.com
        - registry.access.redhat.com
      allowed_images:
        # Official distroless images
        - gcr.io/distroless/base*
        - gcr.io/distroless/static*
        - gcr.io/distroless/nodejs*
        - gcr.io/distroless/python3*
        - gcr.io/distroless/java*
        # Official language runtimes (slim variants)
        - docker.io/library/python:*slim*
        - docker.io/library/python:*alpine*
        - docker.io/library/node:*slim*
        - docker.io/library/node:*alpine*
        - docker.io/library/golang:*alpine*
        - docker.io/library/openjdk:*slim*
        - docker.io/library/eclipse-temurin:*alpine*
        - docker.io/library/maven:*alpine*
        # Red Hat UBI minimal
        - registry.access.redhat.com/ubi8/ubi-minimal
        - registry.access.redhat.com/ubi9/ubi-minimal
        # Chainguard (wolfi)
        - cgr.dev/chainguard/*
        # Microsoft .NET
        - mcr.microsoft.com/dotnet/aspnet:*alpine*
        - mcr.microsoft.com/dotnet/sdk:*alpine*
        # Alpine (for build stages only)
        - docker.io/library/alpine:3.1[89]
        - docker.io/library/alpine:3.2[0-9]
      denied_images:
        - docker.io/library/ubuntu:latest
        - docker.io/library/debian:latest
        - docker.io/library/centos:latest
        - docker.io/library/node:latest
        - docker.io/library/python:latest
        - "*:latest"
      requirements:
        - "Build stages SHOULD use alpine or slim variants"
        - "Final stages MUST use distroless, scratch, ubi-minimal, or chainguard"
        - "Latest tag is PROHIBITED - pin specific versions"
        - "Image digest pinning is PREFERRED over version tags"

# =============================================================================
# SECTION 3: Port Exposure Rules
# =============================================================================
# Controls which ports may be exposed by containers.

port_exposure:
  policy: WARN
  description: Rules governing container port exposure
  rules:
    - id: PORT-001
      severity: HIGH
      category: network
      description: Port 22 (SSH) must not be exposed
      port: 22
      protocol: tcp
      action: BLOCK
      message: "SSH port (22) exposed. Use exec shells via kubectl/SSM instead."
      remediation: "Remove EXPOSE 22 from Dockerfile"

    - id: PORT-002
      severity: HIGH
      category: network
      description: Port 3389 (RDP) must not be exposed
      port: 3389
      protocol: tcp
      action: BLOCK
      message: "RDP port (3389) exposed. Use bastion hosts or VPN instead."

    - id: PORT-003
      severity: MEDIUM
      category: network
      description: Only standard application ports should be exposed
      allowed_ports:
        - 80    # HTTP
        - 443   # HTTPS
        - 3000  # Common app port
        - 5000  # Flask/Go
        - 8080  # Common alternative HTTP
        - 8443  # Alternative HTTPS
        - 9090  # Prometheus / custom
        - 9312  # Sphinx search
        - 11211 # Memcached (scoped)
        - 27017 # MongoDB (scoped)
        - 5432  # PostgreSQL (scoped)
        - 6379  # Redis (scoped)
      action: WARN
      message: "Non-standard port exposed. Verify this is intentional."

